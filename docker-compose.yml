services:
  x3:
    # Published by .github/workflows/deploy-image.yml (linux/amd64 + linux/arm64).
    image: ghcr.io/zeozeozeo/x3:latest
    container_name: x3
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Run this from the cloned repo directory. .env, models.json, x3.db and
      # models/ all live there and are mounted into the container, so config and
      # data persist across upgrades.
      - .:/app
      # Required only if you enable the sandboxed code interpreter
      # (X3_CODE_INTERPRETER_ENABLED=true). Mounting the Docker socket is a
      # host-level trust boundary; remove this line if you don't use it.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Host loopback only. cloudflared, running on the host, reaches these; the
      # internet cannot. Never publish them on 0.0.0.0.
      - "127.0.0.1:6741:6741" # model editor (secret path + login)
      - "127.0.0.1:6743:6743" # /site generator (exposed publicly via the tunnel)
      # Local OpenAI-compatible API. Published on the LAN so other devices can
      # use it; it always requires a bearer key (X3_OPENAI_PROXY_API_KEYS).
      - "6745:6745"
    environment:
      - X3_GOTENBERG_URL=http://gotenberg:3000
      # Bind on the container network so the published ports above work. These
      # override the loopback defaults from .env.
      - X3_MODELED_BIND_ADDR=0.0.0.0:6741
      - X3_SITE_BIND_ADDR=0.0.0.0:6743
      - X3_OPENAI_PROXY_BIND_ADDR=0.0.0.0:6745
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: x3-gotenberg
    restart: unless-stopped
